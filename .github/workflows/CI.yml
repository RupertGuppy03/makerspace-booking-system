# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
# backend job
  backend:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      # The test project references the Server project, so restoring and
      # building the tests also restores and builds the Server.
    - name: Restore dependencies
      run: dotnet restore
      working-directory: makerspace-booking-system.tests
    - name: Build
      run: dotnet build --no-restore
      working-directory: makerspace-booking-system.tests
      # Runs the unit and integration tests. Any failing test fails the job,
      # which blocks the merge through the ruleset.
    - name: Test
      run: dotnet test --no-build --verbosity normal
      working-directory: makerspace-booking-system.tests
      # adding a smoke test to ensure the backend starts and responds to requests
    - name: Smoke test - backend starts and responds
      run: |
        dotnet run --no-build --project ../makerspace-booking-system.Server --urls http://localhost:5000 &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5000/api/tools > /dev/null; then
            echo "Smoke test passed: backend is up and responding"
            exit 0
          fi
          sleep 1
        done
        echo "Smoke test failed: backend did not respond within 30 seconds"
        exit 1
      working-directory: makerspace-booking-system.tests

# frontend job
  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: makerspace-booking-system.client/package-lock.json
    - name: Install dependencies
      run: npm ci
      # addeds linting and build steps for the frontend
      working-directory: makerspace-booking-system.client
    - name: Lint
      run: npm run lint
      working-directory: makerspace-booking-system.client
    - name: Build
      run: npm run build
      working-directory: makerspace-booking-system.client
