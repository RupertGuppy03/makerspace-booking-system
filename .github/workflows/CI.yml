# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
      # The test project references the Server project, so restoring and
      # building the tests also restores and builds the Server.
    - name: Restore dependencies
      run: dotnet restore
      working-directory: makerspace-booking-system.tests
    - name: Build
      run: dotnet build --no-restore
      working-directory: makerspace-booking-system.tests
      # Runs the unit and integration tests. Any failing test fails the job,
      # which blocks the merge through the ruleset.
    - name: Test
      run: dotnet test --no-build --verbosity normal
      working-directory: makerspace-booking-system.tests
  frontend:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: makerspace-booking-system.client/package-lock.json
    - name: Install dependencies
      run: npm ci
      # need to fix the linting errors in the frontend, so commenting out the lint step for now
    #   working-directory: makerspace-booking-system.client
    # - name: Lint
    #   run: npm run lint
      working-directory: makerspace-booking-system.client
    - name: Build
      run: npm run build
      working-directory: makerspace-booking-system.client
